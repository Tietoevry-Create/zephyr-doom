# QSPI flash (Nordic)
CONFIG_NRFX_QSPI=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_XIP=y

# BLE scan tuning (Nordic/NCS bt_scan)
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_SCAN_NAME_CNT=19

# Larger BT RX thread stack; improves stability across boards.
CONFIG_BT_RX_STACK_SIZE=2048

# Multiplayer over USB CDC-ECM (device shows up as a USB Ethernet adapter).
CONFIG_FEATURE_DOOM_NET=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ECM_CLASS=y
CONFIG_UDC_NRF_THREAD_STACK_SIZE=2048
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n

# NET_CONFIG_AUTO_INIT defaults to n when USBD_CDC_ECM_CLASS is set (the USB
# interface does not exist yet at net_config init time), so NET_CONFIG_NEED_IPV4
# is unavailable here and the addresses below are applied by hand from
# N_usb_net_init() in src/n_usb.c once the device has enumerated.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=24

# USB enumeration is slower than a wired link; wait longer before SP/MP decision.
CONFIG_DOOM_NET_LINK_WAIT_MS=8000
