# Native simulator (Linux) build of zephyr-doom.

# Run simulated Zephyr time at host real-time speed (default is uncapped).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# Display: SDL window
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=y
CONFIG_SDL_DISPLAY_ZOOM_PCT=300

# Input: SDL keyboard -> emulated GPIO
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_GPIO_EMUL_SDL=y

# No real flash / SPI / XIP on native
CONFIG_FLASH=n
CONFIG_SPI=n
CONFIG_XIP=n

# Doom feature flags: everything hardware-specific OFF.
CONFIG_FEATURE_DOOM_DISPLAY=n
CONFIG_FEATURE_DOOM_AUDIO=n
CONFIG_FEATURE_DOOM_BLE=n
CONFIG_FEATURE_DOOM_SD=n
CONFIG_FEATURE_DOOM_BUTTONS=n
CONFIG_FEATURE_DOOM_SHIELD=n
CONFIG_FEATURE_DOOM_LEDS=n

# Plenty of heap on the host.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_LOG=y
CONFIG_PRINTK=y
