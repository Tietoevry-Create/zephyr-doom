# Native simulator (Linux) build of zephyr-doom.

# Run simulated Zephyr time at host real-time speed (default is uncapped).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# Display: SDL window
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=y
CONFIG_SDL_DISPLAY_ZOOM_PCT=300

# Input: SDL keyboard -> emulated GPIO
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_GPIO_EMUL_SDL=y

# No real flash / SPI / XIP on native
CONFIG_FLASH=n
CONFIG_SPI=n
CONFIG_XIP=n

# Multiplayer: Chocolate Doom compatible UDP networking.
# CONFIG_FEATURE_DOOM_NET defaults y for native_sim (see Kconfig) and selects
# CONFIG_NETWORKING + CONFIG_NET_SOCKETS. Here we route the BSD socket API to
# the host via offloaded sockets, so no host-side network setup (TAP, root) is
# required: the simulated game talks to a chocolate-server running on the host
# exactly like any other host process.
CONFIG_FEATURE_DOOM_NET=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
# Disable the native TAP Ethernet driver / native IP stack: it would otherwise
# intercept socket() with Zephyr's own address-family constants and conflict
# with the host-offloaded sockets (manifesting as EPFNOSUPPORT on socket()).
CONFIG_ETH_NATIVE_TAP=n

# Doom feature flags: everything hardware-specific OFF.
CONFIG_FEATURE_DOOM_DISPLAY=n
CONFIG_FEATURE_DOOM_AUDIO=n
CONFIG_FEATURE_DOOM_BLE=n
CONFIG_FEATURE_DOOM_SD=n
CONFIG_FEATURE_DOOM_BUTTONS=n
CONFIG_FEATURE_DOOM_SHIELD=n
CONFIG_FEATURE_DOOM_LEDS=n

# Plenty of heap on the host.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_LOG=y
CONFIG_PRINTK=y
