CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
CONFIG_TIMING_FUNCTIONS=y

CONFIG_HEAP_MEM_POOL_SIZE=55000

# Wired joystick shield uses LPADC via Zephyr ADC subsystem.
CONFIG_ADC=y

# Audio (I2S via MCUX SAI) requires a larger DMA TCD queue than Zephyr's default.
CONFIG_DMA_TCD_QUEUE_SIZE=4

# ---- Multiplayer networking (Chocolate Doom 3.0.0 compatible UDP) ----
# Enable the netcode + the real Zephyr IP stack over the FRDM's ENET-QOS
# Ethernet. This is the hardware equivalent of native_sim's offloaded-socket
# path: net_zephyr.c uses the same zsock_* API, but here it is backed by the
# on-chip MAC/PHY instead of the Linux host. The ENET-QOS/MDIO/PHY drivers
# auto-enable from the board devicetree (enet nodes are status "okay").
# Standalone-validated on this board (ICMP ping + UDP echo) before wiring in.
#
# NOTE: deliberately no CONFIG_POSIX_API here. It force-selects POSIX_TIMERS,
# whose timer.c does not compile against this tree's picolibc (struct sigevent
# lacks sigev_notify_function). The Doom netcode is POSIX-free (zsock_* only).
CONFIG_FEATURE_DOOM_NET=y

# Real IP stack (contrast native_sim, which routes sockets to the host).
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n

# Static IPv4 for the direct board<->PC cable (board=.2, PC/server=.1).
# Swap to DHCP (CONFIG_NET_DHCPV4=y, drop the static addr) to join a shared LAN.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Network buffers. Doom packets are tiny (tens of bytes) and the game is strict
# 35 Hz lockstep with <=4 players, so a small pool suffices. Kept lean because
# Doom's 128 KB framebuffers already dominate this board's ~416 KB SRAM.
#
# The ENET-QOS driver reserves one RX net_buf per RX descriptor at init, so
# CONFIG_NET_BUF_RX_COUNT must exceed ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS
# (else "Missing a buf" at bring-up). The RX ring also must hold one full
# 1518 B frame: NUM_RX_BUFDESC * NET_BUF_DATA_SIZE(128) >= 1518, so RX
# descriptors stay at the default 16 (2 KB). Only TX is trimmed; keep NET_BUF
# headroom above the rings for in-flight packets.
CONFIG_ETH_NXP_ENET_QOS_TX_BUFFER_DESCRIPTORS=8
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=12
